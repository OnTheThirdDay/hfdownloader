name: Fetch Model to Release
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face Model ID (e.g., google/flan-t5-small)'
        required: true
        default: 'google/flan-t5-small'
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      - name: Sanitize Model ID
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.model_id }}" | tr '/' '_')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Download Model
        # Added exclusions so it doesn't waste time downloading TensorFlow/Flax weights
        run: |
          hf download ${{ github.event.inputs.model_id }} \
            --local-dir ${{ steps.sanitize.outputs.safe_name }} \
            --exclude "*.h5" "*.msgpack" "*.ot"

      - name: Zip and Split the Model
        run: |
          # 1. Zip the model folder
          zip -r ${{ steps.sanitize.outputs.safe_name }}.zip ${{ steps.sanitize.outputs.safe_name }}
          
          # 2. Split the zip into 1.5GB chunks to bypass the 2GB GitHub limit
          # This creates files ending in .part_aa, .part_ab, etc.
          split -b 1500M ${{ steps.sanitize.outputs.safe_name }}.zip ${{ steps.sanitize.outputs.safe_name }}.zip.part_

      - name: Create Release and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="model-$(date +'%Y%m%d%H%M%S')"
          
          # Upload all the split chunks simultaneously
          gh release create "$TAG_NAME" ${{ steps.sanitize.outputs.safe_name }}.zip.part_* \
            --title "Model: ${{ github.event.inputs.model_id }}" \
            --notes "Automated download of ${{ github.event.inputs.model_id }}"
